<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern KYK Menü</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #0f172a, #1e293b, #0f172a, #1e1b4b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f8fafc;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 40px 30px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            transform: translateY(20px);
            opacity: 0;
            animation: fadeUpIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUpIn {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .header-section {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        /* Tarih Navigasyonu ve Seçici */
        .date-navigation {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 16px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #ffffff;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .nav-btn:active {
            transform: translateY(0);
        }

        .nav-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .date-display-wrapper {
            flex-grow: 1;
            margin: 0 10px;
            overflow: hidden;
        }

        .date {
            font-size: 0.95rem;
            color: #f8fafc;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Tarih Seçici */
        .date-picker-wrapper {
            position: relative;
        }

        .date-input {
            opacity: 0;
            position: absolute;
            right: 0;
            top: 0;
            width: 38px;
            height: 38px;
            cursor: pointer;
            z-index: 2;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 18px 20px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 400;
            color: #e2e8f0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            opacity: 0;
            transform: translateY(10px);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            align-items: center;
            text-align: left;
            transition: transform 0.2s, background-color 0.2s;
        }

        .menu-item:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.06);
        }

        .emoji-icon {
            font-size: 1.3rem;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Liste elemanlarının sırayla gelmesi */
        .menu-item:nth-child(1) { animation-delay: 0.05s; }
        .menu-item:nth-child(2) { animation-delay: 0.1s; }
        .menu-item:nth-child(3) { animation-delay: 0.15s; }
        .menu-item:nth-child(4) { animation-delay: 0.2s; }
        .menu-item:nth-child(5) { animation-delay: 0.25s; }
        .menu-item:nth-child(6) { animation-delay: 0.3s; }

        .empty-state {
            color: #94a3b8;
            font-weight: 400;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px dashed rgba(255, 255, 255, 0.08);
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="header-section">
            <h1>Günün Menüsü</h1>
            
            <div class="date-navigation">
                <!-- Sol Ok (Önceki Gün) -->
                <button class="nav-btn" id="prevDayBtn">
                    <svg viewBox="0 0 24 24"><path d="M15.41,16.58L10.83,12L15.41,7.41L14,6L8,12L14,18L15.41,16.58Z"/></svg>
                </button>

                <!-- Tarih Yazısı -->
                <div class="date-display-wrapper">
                    <div class="date" id="dateDisplay">12 Ekim 2026 Pazartesi</div>
                </div>

                <!-- Sağ ve Tarih Seçici Buton Grubu -->
                <div style="display: flex; gap: 6px;">
                    <!-- Takvim Butonu -->
                    <div class="date-picker-wrapper">
                        <input type="date" id="dateInput" class="date-input" min="2026-10-01" max="2026-10-31" value="2026-10-12">
                        <button class="nav-btn">
                            <svg viewBox="0 0 24 24"><path d="M19,4H17V3a1,1,0,0,0-2,0V4H9V3A1,1,0,0,0,7,0v1H5A3,3,0,0,0,2,8V20a3,3,0,0,0,3,3H19a3,3,0,0,0,3-3V7A3,3,0,0,0,19,4ZM20,20a1,1,0,0,1-1,1H5a1,1,0,0,1-1-1V9H20ZM20,7H4V6A1,1,0,0,1,5,5H7V6A1,1,0,0,0,9,6V5h6V6a1,1,0,0,0,2,0V5h2a1,1,0,0,1,1,1Z"/></svg>
                        </button>
                    </div>
                    <!-- Sağ Ok (Sonraki Gün) -->
                    <button class="nav-btn" id="nextDayBtn">
                        <svg viewBox="0 0 24 24"><path d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"/></svg>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="menu-container" id="menuContainer"></div>
    </div>

    <script>
        const dateDisplay = document.getElementById('dateDisplay');
        const dateInput = document.getElementById('dateInput');
        const menuContainer = document.getElementById('menuContainer');
        const prevDayBtn = document.getElementById('prevDayBtn');
        const nextDayBtn = document.getElementById('nextDayBtn');

        // Şu anki aktif tarih
        let currentDate = new Date("2026-10-12");

        // Emojilerin yemek türlerine göre otomatik atanması için kelime haritası
        const emojiMap = {
            'çorba': '🥣', 'ç.': '🥣', 'sopa': '🥣',
            'kavurma': '🍖', 'kebap': '🍖', 'sote': '🍖', 'tavuk': '🍗', 'pirzola': '🍗', 'köfte': '🧆', 'şinitzel': '🍗', 'tantuni': '🌯', 'burger': '🍔', 'kumpir': '🥔',
            'pilav': '🍚', 'makarna': '🍝', 'börek': '🥮', 'mantı': '🥟',
            'salata': '🥗', 'cacık': '🥣', 'ezme': '🥫', 'tarator': '🥫', 'şakşuka': '🍆', 'yoğurt': '🥛',
            'tatlı': '🍰', 'sarma': '🍰', 'kek': '🍰', 'pasta': '🍰', 'magnolia': '🍨', 'revani': '🍰', 'triliçe': '🍰', 'tulumba': '🍰', 'bisküvili': '🍰',
            'ekmek': '🍞', 'su': '💧', 'ayran': '🥤', 'meyve': '🍎'
        };

        function getEmojiForMeal(mealName) {
            const lower = mealName.toLowerCase();
            for (const [key, emoji] of Object.entries(emojiMap)) {
                if (lower.includes(key)) return emoji;
            }
            return '🍽️';
        }

        // Ekim ayı menü veritabanı
        const monthlyMenu = {
            "2026-10-01": ["Ezogelin Ç. / Domates Ç.", "Tavuk Pirzola+Havuç Tarator / Çoban Kavurma / Karışık Sebze Graten", "Bulgur P. / Makarna", "Çoban Salata", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-02": ["Mercimek Ç. / Şeh. Tavuk Suyu Ç.", "Etsiz Kurufasulye Y. / Mantı", "Pirinç P. / Gül Böreği", "Çiğ Köfte+Yeşillik+Limon", "Saray Sarma", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-03": ["Ezogelin Ç. / Tarhana Ç.", "Kuşbaşı Patlıcan Kebabı / Tavuk Tantuni+Lavaş+Söğüş / İmam Bayıldı", "Bulgur P. / Makarna", "Ayran", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-04": ["Mercimek Ç. / Şehriye Ç.", "Fırında Sebzeli Tavuk / Et Sote+Patates Kız. / Biber Dolması+Yoğurt", "Pirinç P. / Makarna", "Nohut Salatası", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-05": ["Ezogelin Ç. / Yayla Ç.", "İzmir Köfte / Taze Fasulye Y.", "Bulgur P. / Makarna", "Kıbrıs Tatlısı", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-06": ["Mercimek Ç. / Mantar Ç.", "Şinitzel+Rus Salatası / Orman Kebabı / Bezelye Y.", "Pirinç P. / Makarna", "Karışık Salata", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-07": ["Ezogelin Ç. / Sebze Ç.", "Pideli Köfte / Kumpir", "Bulgur P. / Makarna", "Patlıcan Ezme", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-08": ["Mercimek Ç. / Domates Ç.", "Tavuk Çökertme / Etli Sultan Kebabı / Ratatuy", "Pirinç P. / Makarna", "Sütlaç", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-09": ["Ezogelin Ç. / Tarhana Ç.", "Güveç / Tavuk Şiş+Lavaş+Söğüş / Mücver", "Bulgur P. / Makarna", "Acılı Ezme", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-10": ["Mercimek Ç. / Yayla Ç.", "Tavuk Sote / Etli Kağıt Kebabı / Soslu Karışık Kız.", "Pirinç P. / Makarna", "Gavurdağı Salata", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-11": ["Ezogelin Ç. / Şeh. Tavuk Suyu Ç.", "Etsiz Nohut Y. Veya Fırında Nohut Tava / Kara Lahana Dolması+Yoğurt", "Bulgur P. / Makarna", "Kadayıf (Fındıklı)", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-12": ["Mercimek Ç. / Sebze Ç.", "Çoban Kavurma / Tavuk Izgara+Rus Salatası / Barbunya Y.", "Pirinç P. / Makarna", "Karışık Salata", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-13": ["Ezogelin Ç. / Mantar Ç.", "Burger+Patates Kız. / Tas Kebabı / Mevsim Türlü", "Bulgur P. / Makarna", "Islak Kek", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-14": ["Mercimek Ç. / Şehriye Ç.", "Biber Dolması+Yoğurt", "Pirinç P. / Makarna", "Ayran veya Meyve Suyu", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-15": ["Ezogelin Ç. / Yayla Ç.", "Tavuk Fajita+Lavaş / Fırında Sebzeli Et Y. / Taze Fasulye Y.", "Bulgur P. / Makarna", "Çoban Salata", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-16": ["Mercimek Ç. / Şeh. Tavuk Suyu Ç.", "Etsiz Kurufasulye Y. / Karışık Sebze Graten", "Pirinç P. / Makarna", "Arpa Şeh. Salatası", "Revani", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-17": ["Ezogelin Ç. / Domates Ç.", "Çıtır Tavuk+Ekmek Dilim Patates / Bahçıvan Kebabı / Mantar Sote", "Bulgur P. / Makarna", "Havuç Tarator", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-18": ["Mercimek Ç. / Sebze Ç.", "Kuşbaşı Patlıcan Kebabı / Tavuk Haşlama / Soslu Karışık Kızartma", "Pirinç P. / Makarna", "Cacık", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-19": ["Ezogelin Ç. / Tarhana Ç.", "Şinitzel+ Rus Salatası / Et Sote+Bah. Küp Patates Kız. / Ratatuy", "Bulgur P. / Makarna", "Baklava (Cevizli)", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-20": ["Mercimek Ç. / Mantar Ç.", "Adana Urfa Kebap+Piyaz / İmam Bayıldı", "Pirinç P. / Makarna", "Cacık", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-21": ["Ezogelin Ç. / Yayla Ç.", "Tavuk Pirzola+Havuç Tarator / Orman Kebabı / Kumpir", "Bulgur P. / Makarna", "Karışık Salata", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-22": ["Mercimek Ç. / Şeh. Tavuk Suyu Ç.", "Etsiz Nohut Y. Veya Fırında Nohut Tava / Biber Dolması+Yoğurt", "Pirinç P. / Makarna", "Şakşuka (patatessiz)", "Triliçe", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-23": ["Ezogelin Ç. / Domates Ç.", "Sebzeli Köfte Dizme / Karnabahar Kız+Yoğurt", "Bulgur P. / Makarna", "Gavurdağı Salata", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-24": ["Mercimek Ç. / Şehriye Ç.", "Tavuk Sote / Güveç / Mantı", "Pirinç P. / Tepsi Böreği", "Kısır", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-25": ["Ezogelin Ç. / Tarhana Ç.", "Etli Sultan Kebabı / Tavuk Çökertme / Taze Fasulye", "Bulgur P. / Makarna", "Tulumba", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-26": ["Mercimek Ç. / Yayla Ç.", "Fırında Sebzeli Tavuk / Tas Kebabı / Karışık Sebze Graten", "Pirinç P. / Makarna", "Karışık Salata", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-27": ["Ezogelin Ç. / Şeh. Tavuk Suyu Ç.", "Etsiz Kurufasulye Y. / İmam Bayıldı", "Bulgur P. / Makarna", "Yoğurt", "Bisküvili Pasta", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-28": ["Mercimek Ç. / Tarhana Ç.", "Tepsi Kebabı / Tavuk Burger+Patates Kız. / Mantar Sote", "Pirinç P. / Makarna", "Çoban Salata", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-29": ["Ezogelin Ç. / Domates Ç.", "Tavuk Şiş+Söğüş+Lavaş / Antep Tava / Kumpir", "Bulgur P. / Makarna", "Köpoğlu", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-30": ["Mercimek Ç. / Sebze Ç.", "Akçaabat Köfte+Piyaz / Biber Dolması+Yoğurt", "Pirinç P. / Makarna", "Ayran veya Meyve Suyu", "Çeyrek Ekmek, 500 ml Su"],
            "2026-10-31": ["Ezogelin Ç. / Mantar Ç.", "Et Çökertme / Fırında Tavuk Baget Ispanak veya Pazı Kavurması+Yoğurt", "Bulgur P. / Makarna", "Kadayıflı Magnolia", "Çeyrek Ekmek, 500 ml Su"]
        };

        function formatDate(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function loadMenuForDate(date) {
            const dateStr = formatDate(date);
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            dateDisplay.textContent = date.toLocaleDateString('tr-TR', options);
            dateInput.value = dateStr;

            // Veritabanından yemekleri çek ve yerleştir
            const meals = monthlyMenu[dateStr];
            menuContainer.innerHTML = '';

            if (meals && meals.length > 0) {
                meals.forEach((meal, index) => {
                    const item = document.createElement('div');
                    item.className = 'menu-item';
                    item.style.animationDelay = `${index * 0.05}s`;
                    
                    const emoji = getEmojiForMeal(meal);
                    item.innerHTML = `<span class="emoji-icon">${emoji}</span><span>${meal}</span>`;
                    menuContainer.appendChild(item);
                });
            } else {
                menuContainer.innerHTML = `<div class="empty-state">Bu tarihe ait bir menü bulunamadı.</div>`;
            }

            // Butonların aktiflik durumunu sınırla (Sadece Ekim 2026 için)
            prevDayBtn.disabled = dateStr === "2026-10-01";
            nextDayBtn.disabled = dateStr === "2026-10-31";
            prevDayBtn.style.opacity = prevDayBtn.disabled ? "0.3" : "1";
            nextDayBtn.style.opacity = nextDayBtn.disabled ? "0.3" : "1";
        }

        // Gün Değiştirme
        function changeDay(offset) {
            const newDate = new Date(currentDate);
            newDate.setDate(currentDate.getDate() + offset);

            // Ekim 2026 sınırları dışına çıkmayı engelle
            if (newDate >= new Date("2026-10-01") && newDate <= new Date("2026-10-31")) {
                currentDate = newDate;
                loadMenuForDate(currentDate);
            }
        }

        // Event Listenerlar
        prevDayBtn.addEventListener('click', () => changeDay(-1));
        nextDayBtn.addEventListener('click', () => changeDay(1));

        dateInput.addEventListener('change', (e) => {
            currentDate = new Date(e.target.value);
            loadMenuForDate(currentDate);
        });

        // İlk açılış
        loadMenuForDate(currentDate);
    </script>
</body>
</html>
